# ============================================
# ESSENTIAL SETTINGS
# ============================================

set -sg escape-time 0

set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

set -g focus-events on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ============================================
# KEY BINDINGS
# ============================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind -n M-| split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-q confirm-before -p "kill-pane #P? (y/n)" kill-pane

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# APPEARANCE
# ============================================

set -g @catppuccin_flavor 'frappe'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-status-style "fg=#{@thm_blue},bg=default,none"
set -g window-status-current-style "fg=#{@thm_bg},bg=#{@thm_blue},none"
set -g pane-active-border-style "fg=#{@thm_blue}"
set -g window-status-format "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_blue},bg=#{@thm_surface_0}] #I:#W - #{b:pane_current_path} #[fg=#{@thm_surface_0},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_blue},bg=default]#[fg=#{@thm_bg},bg=#{@thm_blue},bold] #I:#W - #{pane_current_path} #[fg=#{@thm_blue},bg=default]"
set -g status-left '#[bg=#{@thm_bg}]'
set -g status-right '#[fg=#{@thm_bg},bg=#{@thm_blue}] session: #S #[fg=#{@thm_bg},bg=#{@thm_peach}] %H:%M %d-%b-%y '
set -g status-right-length 100
set -g message-style 'fg=#{@thm_bg},bg=#{@thm_green} bold'

# ============================================
# COPY MODE
# ============================================

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"  # Linux


# ============================================
# alt + num tab switching
# ============================================

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
